# Builds the Study OS Android app (a Trusted Web Activity for the deployed website).
# Result: an installable APK (to try on a phone) and an AAB (to upload to Google Play),
# attached to the run under "Artifacts". See android/README.md.
#
# Settings (Repository → Settings → Secrets and variables → Actions):
#   Variables: ANDROID_SITE_URL      e.g. https://study-os-pk.netlify.app   (required for a useful app)
#              ANDROID_PACKAGE_NAME  e.g. app.studyos.android              (optional)
#   Secrets (optional, for Play Store builds signed with your upload key):
#              ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android app

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Website URL (defaults to the ANDROID_SITE_URL variable)"
        required: false
      version_name:
        description: "Version name shown to users, e.g. 1.0.0 (defaults to 1.0.<run number>)"
        required: false
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      SITE_URL: ${{ inputs.site_url || vars.ANDROID_SITE_URL || 'https://study-os.netlify.app' }}
      APP_ID: ${{ vars.ANDROID_PACKAGE_NAME || 'app.studyos.android' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ inputs.version_name || format('1.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check settings
        env:
          CONFIGURED_URL: ${{ inputs.site_url || vars.ANDROID_SITE_URL }}
        run: |
          case "$SITE_URL" in https://*) ;; *) echo "::error::Website URL must start with https:// (got '$SITE_URL')"; exit 1;; esac
          if [ -z "$CONFIGURED_URL" ]; then
            echo "::warning::ANDROID_SITE_URL is not set, so this build opens the placeholder $SITE_URL. Set it to your deployed site (see android/README.md)."
          fi

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=your upload key" >> "$GITHUB_ENV"
          else
            echo "::notice::No signing key configured: this is a test build signed with a temporary key. Fine for installing on your phone; not for Google Play."
            echo "SIGNED_WITH=a temporary test key" >> "$GITHUB_ENV"
          fi

      - name: Build APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease \
            "-PsiteUrl=$SITE_URL" "-PappId=$APP_ID" "-PversionCode=$VERSION_CODE" "-PversionName=$VERSION_NAME"

      - name: Collect files and signing fingerprint
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/StudyOS-$VERSION_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/StudyOS-$VERSION_NAME.aab"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          FP=$("$APKSIGNER" verify --print-certs "$RUNNER_TEMP/out/StudyOS-$VERSION_NAME.apk" | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          {
            echo "## Study OS for Android $VERSION_NAME"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Opens | $SITE_URL |"
            echo "| Package name | \`$APP_ID\` |"
            echo "| Version | $VERSION_NAME (code $VERSION_CODE) |"
            echo "| Signed with | $SIGNED_WITH |"
            echo "| Signing SHA-256 | \`$FP\` |"
            echo ""
            echo "Download **StudyOS-android** under *Artifacts* below: the \`.apk\` installs on a phone, the \`.aab\` is for Google Play."
            echo ""
            echo "To remove the address bar, set \`ANDROID_CERT_SHA256\` on your website host to the fingerprint above"
            echo "(for Play Store installs, also add the *App signing key* SHA-256 from Play Console, comma-separated)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the app
        run: |
          APK="$RUNNER_TEMP/out/StudyOS-$VERSION_NAME.apk"
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          BADGING=$("$AAPT2" dump badging "$APK")
          RESOURCES=$("$AAPT2" dump resources "$APK")
          echo "$BADGING" | grep -E "^(package|targetSdkVersion|sdkVersion|application-label|launchable-activity)"
          echo "$BADGING" | grep -q "package: name='$APP_ID'" || { echo "::error::package name is not $APP_ID"; exit 1; }
          echo "$BADGING" | grep -q "targetSdkVersion:'36'" || { echo "::error::targetSdkVersion is not 36"; exit 1; }
          echo "$BADGING" | grep -q "launchable-activity: name='com.google.androidbrowserhelper.trusted.LauncherActivity'" || { echo "::error::launcher activity missing"; exit 1; }
          echo "$RESOURCES" | grep -F -q "\"$SITE_URL/dashboard\"" || { echo "::error::launch URL is not $SITE_URL/dashboard"; echo "$RESOURCES" | grep -A1 launchUrl; exit 1; }
          echo "$RESOURCES" | grep -A1 -E "string/(launchUrl|assetStatements)"
          echo "Verified: $APP_ID opens $SITE_URL/dashboard, targets API 36."

      - uses: actions/upload-artifact@v4
        with:
          name: StudyOS-android
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30
