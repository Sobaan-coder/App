<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href /app/` when served behind the landing site. -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BusinessPilot — Your Business. One Simple Conversation.</title>
  <meta name="description" content="Run your business by simply telling us what happened. AI-powered sales, expenses, inventory and customer balances for small businesses.">
  <meta name="theme-color" content="#0E7C66">
  <meta name="robots" content="noindex">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BusinessPilot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Lightweight splash shown until Flutter paints its first frame. */
    html, body { margin: 0; height: 100%; background: #F6F8F7; }
    @media (prefers-color-scheme: dark) { html, body { background: #0B1110; } }
    #bp-splash { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 16px;
      align-items: center; justify-content: center; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #0E7C66; }
    #bp-splash img { width: 72px; height: 72px; }
    #bp-splash p { margin: 0; font-weight: 600; }
  </style>
</head>
<body>
  <div id="bp-splash" aria-live="polite"><img src="icons/Icon-192.png" alt=""><p>Loading BusinessPilot…</p></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('bp-splash'); if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
